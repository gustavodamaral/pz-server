[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "pz-server-watchdog"
version = "0.1.0"
description = "Conservative lifecycle watchdog and status tooling for Project Zomboid"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "pz-server maintainers" }]
dependencies = [
    "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.3",
]

[project.scripts]
pz-watchdog = "pz_watchdog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pz_watchdog"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=pz_watchdog.config --cov=pz_watchdog.engine --cov=pz_watchdog.rcon --cov=pz_watchdog.service --cov=pz_watchdog.shutdown --cov-report=term-missing --cov-fail-under=90"
testpaths = ["watchdog/tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "watchdog/tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "LOG", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
